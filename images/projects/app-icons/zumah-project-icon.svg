      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf1f6"/>
    </linearGradient>
    <linearGradient id="navy-slab" x1="112" y1="248" x2="400" y2="144" gradientUnits="userSpaceOnUse">
